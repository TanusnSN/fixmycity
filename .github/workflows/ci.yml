name: CI-CD

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fixmycity:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8000:8000 fixmycity:ci
          for i in $(seq 1 20); do curl -sf http://localhost:8000/ && break || sleep 2; done
          curl -sf http://localhost:8000/
          docker rm -f app
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Publish image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER/fixmycity:latest
          docker tag fixmycity:ci $IMAGE
          docker push $IMAGE

  deploy:
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      AZURE_WEBHOOK_URL: ${{ secrets.AZURE_WEBHOOK_URL }}
    steps:
      - name: Deploy to Azure
        run: |
          if [ -z "$AZURE_WEBHOOK_URL" ]; then
            echo "AZURE_WEBHOOK_URL not set yet - skipping deploy"
          else
            curl -fsS -X POST "$AZURE_WEBHOOK_URL"
            echo "Azure told to pull the new image"
          fi